name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  VERUS_VERSION: "0.2026.06.28.1847ab3"
  DUVET_VERSION: "0.4.3"

jobs:
  build:
    name: Build & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"
          components: clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build
        run: cargo build

      - name: Clippy
        run: cargo clippy -- -D warnings

  verify:
    name: Verus Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Verus
        run: |
          curl -L -o verus.zip \
            "https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q verus.zip
          echo "$PWD/verus-x86-linux" >> "$GITHUB_PATH"

      - name: Verify
        run: cargo verus verify

  duvet:
    name: RFC 8259 Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install duvet
        run: cargo install duvet --locked --version "${DUVET_VERSION}"

      # Verifies every RFC 8259 requirement is covered by an implementation,
      # implication, or exception annotation. Uses the specification cached
      # under .duvet/specifications/ so no network access is required.
      - name: Check requirement coverage
        run: duvet query --check implementation
